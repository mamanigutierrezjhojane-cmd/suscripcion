<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planes de Suscripción</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="text-center mb-5">Planes de Suscripción</h1>

    <div class="row g-4">
      <div class="col-12 col-md-4">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title">Básico</h5>
            <p class="display-4 fw-bold text-primary">$19</p>
            <button class="btn btn-outline-primary">Elegir</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title text-muted">Pro VIP</h5>
            <p class="display-4 fw-bold text-warning">$49</p>
            <button class="btn btn-outline-warning text-dark fw-bold">Elegir</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card text-center h-100">
          <div class="card-body">
            <h5 class="card-title">Premium</h5>
            <p class="display-4 fw-bold text-dark">$99</p>
            <button class="btn btn-outline-dark">Elegir</button>
          </div>
        </div>
      </div>

    </div>
  </div>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>
</html>
